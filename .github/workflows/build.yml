name: Build patched PHP for Ubuntu 20.04

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: "PHP version to build"
        type: choice
        options: ["all", "7.4", "5.6"]
        default: "all"
      force:
        description: "Rebuild even if a release for this source revision already exists"
        type: boolean
        default: false
      require_cves:
        description: "Override required CVE list (space-separated). Leave empty for the script default."
        type: string
        default: ""
  schedule:
    # Daily check for a new Sury source revision (03:17 UTC).
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: php-focal-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "5.6"]

    env:
      GH_TOKEN: ${{ github.token }}
      PHP_VER: ${{ matrix.php }}
      FORCE: ${{ inputs.force || 'false' }}

    steps:
      - name: Check whether this version was selected
        id: sel
        run: |
          want="${{ inputs.php_version || 'all' }}"
          if [ "$want" = "all" ] || [ "$want" = "$PHP_VER" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "PHP $PHP_VER not selected; skipping."
          fi

      - name: Check out repository
        if: steps.sel.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Find newest Sury source
        if: steps.sel.outputs.run == 'true'
        id: src
        run: |
          chmod +x build-php-focal.sh scripts/latest-sury-dsc.sh
          out="$(./scripts/latest-sury-dsc.sh "$PHP_VER")"
          rev="${out%% *}"
          url="${out#* }"
          [ -n "$rev" ] && [ -n "$url" ] || { echo "Could not determine source"; exit 1; }
          tag="php${PHP_VER}-r${rev}"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Newest source: revision $rev"
          echo "  $url"
          if gh release view "$tag" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $tag already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages
        if: steps.sel.outputs.run == 'true' && steps.src.outputs.exists == 'false'
        id: build
        env:
          DSC_URL: ${{ steps.src.outputs.url }}
          REQUIRE_CVES_INPUT: ${{ inputs.require_cves }}
        run: |
          if [ -n "$REQUIRE_CVES_INPUT" ]; then export REQUIRE_CVES="$REQUIRE_CVES_INPUT"; fi
          set +e
          ./build-php-focal.sh "$PHP_VER"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 3 ]; then
            echo "::notice::Sury's newest php${PHP_VER} source (revision ${{ steps.src.outputs.rev }}) does not mention the required CVE fixes yet. Nothing was released."
            exit 0
          fi
          exit "$code"

      - name: Upload build log on failure
        if: failure() && steps.sel.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-php${{ matrix.php }}
          path: php${{ matrix.php }}-focal-debs/build.log
          if-no-files-found: ignore

      - name: Publish release
        # Explicit checks: a skipped step has no outputs, and GitHub compares a
        # missing value with '0' as equal, so 'code == 0' alone is not enough.
        if: >-
          steps.sel.outputs.run == 'true' &&
          steps.src.outputs.exists == 'false' &&
          steps.build.outcome == 'success' &&
          steps.build.outputs.code == '0'
        env:
          TAG: ${{ steps.src.outputs.tag }}
          SRC_URL: ${{ steps.src.outputs.url }}
        run: |
          dir="php${PHP_VER}-focal-debs"
          common="$(ls -1 "$dir"/php${PHP_VER}-common_*.deb 2>/dev/null | head -n1 || true)"
          if [ -z "$common" ]; then
            echo "::error::No php${PHP_VER}-common package found in $dir; refusing to publish."
            exit 1
          fi
          pkgver="$(dpkg-deb -f "$common" Version)"

          # Ship the installer inside the bundle and cover it with the checksums.
          cp install-php-debs.sh "$dir/"
          (cd "$dir" && sha256sum ./install-php-debs.sh >> SHA256SUMS)

          # One bundle with safe asset names (GitHub may rename '+' and '~').
          asset="php${PHP_VER}-focal-r${{ steps.src.outputs.rev }}.tar.gz"
          tar -czf "$asset" -C "$dir" .
          sha256sum "$asset" > "$asset.sha256"

          {
            echo "Unofficial rebuild of Ondřej Surý's \`php${PHP_VER}\` source for **Ubuntu 20.04 (focal), amd64**."
            echo
            echo "- Package version: \`$pkgver\`"
            echo "- Source: $SRC_URL"
            echo "- Built by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Install on the server:"
            echo '```'
            echo "sudo ./install-from-release.sh ${PHP_VER}"
            echo '```'
            echo
            echo "Top of the source changelog:"
            echo '```'
            sed -n '/^--- Top of the source changelog/,/^--- Checking required/p' "$dir/build.log" \
              | sed '1d;$d' | head -n 40
            echo '```'
          } > release-notes.md

          if [ "$FORCE" = "true" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" \
            "$asset" "$asset.sha256" "$dir/build.log" \
            --title "PHP ${PHP_VER} for Ubuntu 20.04 (${pkgver})" \
            --notes-file release-notes.md

      - name: Repo Keepalive
        env:
          DAYS_ELAPSED: 55
          USE_API: true
          GH_TOKEN: ${{ github.token }}
        run: curl -sL action-keepalive.bos.li | bash
